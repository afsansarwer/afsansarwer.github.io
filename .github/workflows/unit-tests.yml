name: Integration tests

on:
  push:
    branches:
      - master
      - main
      - v1.0-dev
    paths:
      - "Gemfile"
      - "Gemfile.lock"
      - "_config.yml"
      - "_data/**"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "assets/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    branches:
      - master
      - main
      - v1.0-dev
    paths:
      - "Gemfile"
      - "Gemfile.lock"
      - "_config.yml"
      - "_data/**"
      - "_pages/**"
      - "_posts/**"
      - "_projects/**"
      - "assets/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/unit-tests.yml"

jobs:
  comments-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS deps 📦
        run: npm ci

      - name: Run style contract lint 🧷
        run: npm run lint:style-contract

      - name: Install build prerequisites 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert pyyaml

      - name: Prepare fixtures for starter integration tests
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import yaml
          path = Path('_config.yml')
          config = yaml.safe_load(path.read_text())
          config['exclude'] = [entry for entry in config['exclude'] if entry != '_posts/']
          config['protect_email'] = False
          path.write_text(yaml.safe_dump(config, sort_keys=False))
          PYTHON

      - name: Run comments integration test 🧪
        run: bash test/integration_comments.sh

      - name: Run plugin toggle integration test 🔌
        run: bash test/integration_plugin_toggles.sh

      - name: Run distill integration test 📄
        run: bash test/integration_distill.sh

      - name: Run bootstrap compatibility integration test 🧩
        run: bash test/integration_bootstrap_compat.sh

      - name: Run upgrade CLI integration test ⬆️
        run: bash test/integration_upgrade_cli.sh

      - name: Run CSS minify integration test 🎨
        run: bash test/integration_css_minify.sh

      - name: Run new plugin integration checks 🧩
        run: bash test/integration_new_plugins.sh

  academic-site:
    name: Academic portfolio checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Install build prerequisites
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
      - name: Build portfolio
        run: bundle exec jekyll build
      - name: Check portfolio content and Ctrl-K index
        run: python3 test/academic_site.py
